[pytest]
# Pytest configuration for optimal performance
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Performance optimizations
# Note: Using -n 0 (sequential) instead of -n auto to avoid parallel execution issues
# with file-based ticket storage. For faster execution, use: pytest -n auto
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings
    --timeout=30
    --timeout-method=thread
    -n 0

# Test discovery
norecursedirs = .git .venv venv __pycache__ node_modules .pytest_cache

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_api: marks tests that require API server running
    requires_auth: marks tests that require authentication

