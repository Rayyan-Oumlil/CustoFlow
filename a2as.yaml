tools:
  add_order_note:
    type: wrapper
    agents: [order_agent]
    params:
      wrapper: FunctionTool
      wraps: add_order_note
      description: "Add a note to an order.\n\nThis tool allows agents to add notes to orders for tracking purposes.\nNotes\
        \ can be internal (for support team) or customer-facing.\n\nArgs:\n    order_id: The order ID to add a note to\n \
        \   note: The note text to add\n    note_type: Type of note (general, customer_request, internal, refund_request,\
        \ etc.)\n    \nReturns:\n    Dictionary with status and order information"
  agent_tool:
    type: agent
    agents: [orchestrator_agent]
    params:
      wrapper: AgentTool
  cancel_order:
    type: wrapper
    agents: [order_agent]
    params:
      wrapper: FunctionTool
      wraps: cancel_order
      description: "Cancel an order.\n\nThis tool allows agents to cancel orders when requested by the customer.\nIMPORTANT:\
        \ Only orders in \"processing\" status can be cancelled.\nOrders that are already shipped, delivering, or delivered\
        \ cannot be cancelled.\n\nArgs:\n    order_id: The order ID to cancel\n    reason: Optional reason for cancellation\n\
        \    \nReturns:\n    Dictionary with status and order information"
  cancel_ticket:
    type: wrapper
    agents: [escalation_agent]
    params:
      wrapper: FunctionTool
      wraps: cancel_ticket
      description: "Cancel a support ticket.\n\nIf ticket_id is not provided, will search for the most recent ticket for the\
        \ user/session.\n\nArgs:\n    ticket_id: The ticket ID to cancel (optional - will search for recent ticket if not\
        \ provided)\n    reason: Optional reason for cancellation\n    session_id: Optional session ID to find recent ticket\
        \ if ticket_id not provided\n    user_id: Optional user ID to find recent ticket if ticket_id not provided\n    \n\
        Returns:\n    Dictionary with status and ticket information"
  create_ticket:
    type: wrapper
    agents: [escalation_agent]
    params:
      wrapper: FunctionTool
      wraps: create_ticket
      description: Créer un ticket.
  get_conversation_history:
    type: wrapper
    agents: [orchestrator_agent]
    params:
      wrapper: FunctionTool
      wraps: get_conversation_history
      description: "Get recent conversation history.\n\nThis tool allows agents to see recent messages in the conversation.\n\
        \nArgs:\n    session_id: Optional session ID (will be retrieved from context if not provided)\n    user_id: Optional\
        \ user ID (will be retrieved from context if not provided)\n    limit: Maximum number of messages to retrieve (default:\
        \ 20)\n    \nReturns:\n    Dictionary with conversation history:\n    - Success: {\"status\": \"success\", \"messages\"\
        : [...], \"count\": N}\n    - Error: {\"status\": \"error\", \"error_message\": \"...\"}"
  get_customer_orders:
    type: wrapper
    agents: [order_agent]
    params:
      wrapper: FunctionTool
      wraps: get_customer_orders
      description: "Get all orders for a customer.\n\nArgs:\n    customer_id: The customer ID to look up (optional, will try\
        \ to get from context if not provided)\n    session_id: Optional session ID to get customer_id from context (will\
        \ try to find from context if not provided)\n    \nReturns:\n    Dictionary with status and list of orders"
  get_ticket_status:
    type: wrapper
    agents: [escalation_agent]
    params:
      wrapper: FunctionTool
      wraps: get_ticket_status
  lookup_order:
    type: wrapper
    agents: [order_agent]
    params:
      wrapper: FunctionTool
      wraps: lookup_order
      description: "Look up order information by order ID.\n\nThis tool searches the order database to retrieve comprehensive\
        \ order details\nincluding status, items, shipping information, and tracking numbers.\n\nImplementation Details:\n\
        - Validates order ID format\n- Searches mock database (replace with real DB/API in production)\n- Returns structured\
        \ response with all order information\n- Provides helpful error messages with guidance\n\nArgs:\n    order_id: The\
        \ order ID to look up (e.g., \"12345\")\n    \nReturns:\n    Dictionary with status and order information:\n    -\
        \ Success: {\n        \"status\": \"success\",\n        \"order\": {\n            \"order_id\": str,\n           \
        \ \"customer_id\": str,\n            \"status\": str,  # processing, shipped, delivered, cancelled\n            \"\
        items\": List[Dict],\n            \"total\": float,\n            \"order_date\": str,\n            \"shipped_date\"\
        : str | None,\n            \"tracking_number\": str | None,\n            \"estimated_delivery\": str | None\n    \
        \    }\n      }\n    - Error: {\n        \"status\": \"error\",\n        \"error_message\": str,\n        \"helpful_info\"\
        : str  # Guidance for customer\n      }"
  request_refund:
    type: wrapper
    agents: [order_agent]
    params:
      wrapper: FunctionTool
      wraps: request_refund
      description: "Request a refund for an order.\n\nThis tool allows agents to create refund requests for customers.\nThe\
        \ refund request is added as a note and can be processed by the finance team.\n\nArgs:\n    order_id: The order ID\
        \ to request refund for\n    reason: Reason for the refund request\n    amount: Optional refund amount (if partial\
        \ refund). If not provided, full order amount is assumed.\n    \nReturns:\n    Dictionary with status and refund request\
        \ information"
  search_faq:
    type: wrapper
    agents: [faq_agent]
    params:
      wrapper: FunctionTool
      wraps: search_faq
  shipping_tracking_tool:
    type: function
    agents: [order_agent]
  summarize_conversation:
    type: wrapper
    agents: [orchestrator_agent]
    params:
      wrapper: FunctionTool
      wraps: summarize_conversation
      description: "Summarize the current conversation.\n\nThis tool allows agents to provide a summary of what has been discussed\n\
        in the conversation so far. Useful when customers ask \"what did we talk about?\"\n\nArgs:\n    session_id: Optional\
        \ session ID (will be retrieved from context if not provided)\n    user_id: Optional user ID (will be retrieved from\
        \ context if not provided)\n    \nReturns:\n    Dictionary with summary information:\n    - Success: {\"status\":\
        \ \"success\", \"summary\": \"...\", \"key_points\": {...}}\n    - Error: {\"status\": \"error\", \"error_message\"\
        : \"...\"}"
  ticket_tool_lro:
    type: function
    agents: [escalation_agent]
  update_ticket_priority:
    type: wrapper
    agents: [escalation_agent]
    params:
      wrapper: FunctionTool
      wraps: update_ticket_priority
      description: "Update the priority of a support ticket.\n\nArgs:\n    ticket_id: The ticket ID to update\n    new_priority:\
        \ New priority (must be one of: low, normal, high, urgent)\n    \nReturns:\n    Dictionary with status and ticket\
        \ information"
  update_ticket_status_tool:
    type: wrapper
    agents: [escalation_agent]
    params:
      wrapper: FunctionTool
      wraps: update_ticket_status_tool

