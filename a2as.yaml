    params:
      caller: [os.getenv]
      path: [config.settings]
  PYTEST_CURRENT_TEST:
    type: env
    params:
      caller: [os.getenv]
      path: [tools.order_tool]
  PYTHONWARNINGS:
    type: env
    params:
      caller: [os.environ]
  SUPABASE_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [tools.order_tool, api.server, tools.ticket_modification_tool, tools.order_modification_tool, utils.supabase_client]
  SUPABASE_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [tools.order_tool, api.server, tools.ticket_modification_tool, tools.order_modification_tool, utils.supabase_client]

files:
  .env:
    type: literal
    actions: [read]
    params:
      caller: [_load_env_file]
      path: [project_root]
  .json:
    type: literal
    actions: [read]
    params:
      caller: [create_version, get_version]
      path: [self.versions_dir]
  agent_refinements.json:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [self.data_dir]
  auto_learning.json:
    type: literal
    actions: [read]
    params:
      caller: [save_auto_learning, get_auto_learning, update_auto_learning_status]
      path: [data_dir]
  auto_learning_file:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load]
      alias: [f]
  conversation_history.json:
    type: literal
    actions: [read]
    params:
      path: [Path.parent.parent]
  conversation_summaries.json:
    type: literal
    actions: [read]
    params:
      path: [Path.parent.parent]
  data_dir:
    type: variable
    actions: [read, write]
    params:
      caller: [Path, data_dir.mkdir]
  faq_knowledge_base.json:
    type: literal
    actions: [read]
    params:
      caller: [apply_single_kb_update]
      path: [Path.parent.parent]
  feedback.json:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [self.data_dir]
  feedback_insights.json:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [self.data_dir]
  HISTORY_FILE:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load, HISTORY_FILE.parent.mkdir]
      alias: [f]
  kb_file:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load]
      alias: [f]
  kb_updates_from_feedback.json:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [self.data_dir]
  metadata_file:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load]
      alias: [f]
  orders.json:
    type: literal
    actions: [read]
    params:
      path: [Path.parent.parent]
  ORDERS_FILE:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load, ORDERS_FILE.parent.mkdir]
      alias: [f]
  SUMMARY_FILE:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load, SUMMARY_FILE.parent.mkdir]
      alias: [f]
  version_file:
    type: variable
    actions: [write, read]
    params:
      caller: [open, json.load]
      alias: [f]
  versions_metadata.json:
    type: literal
    actions: [read]
    params:
      caller: [_load_versions_metadata, _save_versions_metadata]
      path: [self.versions_dir]
